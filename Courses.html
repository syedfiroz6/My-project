<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>99.com Courses</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #f5f5f5;
    }

    header {
      background-color: #1e1e2f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      color: white;
    }

    .menu {
      font-size: 24px;
      cursor: pointer;
      position: relative;
    }

    .menu-items {
      display: none;
      position: absolute;
      background-color: #333;
      border-radius: 4px;
      top: 40px;
      left: 10px;
      z-index: 10;
    }

    .menu:hover .menu-items {
      display: block;
    }

    .menu-items a {
      color: white;
      padding: 10px 15px;
      display: block;
      text-decoration: none;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      animation: colorChange 4s infinite;
    }

    @keyframes colorChange {
      0% { color: #ff4d4d; }
      25% { color: #ffcc00; }
      50% { color: #33cc33; }
      75% { color: #3399ff; }
      100% { color: #ff4d4d; }
    }

    h1 {
      text-align: center;
      padding: 20px;
      color: #333;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .courses {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .course {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: transform 0.3s;
      cursor: pointer;
    }

    .course:hover {
      transform: scale(1.05);
    }

    .red    { background-color: #ffdddd; color: #a30000; }
    .green  { background-color: #ddffdd; color: #006600; }
    .blue   { background-color: #ddeeff; color: #004080; }
    .orange { background-color: #fff0cc; color: #cc7a00; }
    .purple { background-color: #f0ddff; color: #5e0099; }
    .teal   { background-color: #ddffff; color: #008080; }
.video-section {
  display: block;
  background-color: #004d4d;
  color: #ffffff;
  padding: 20px;
  margin: 20px auto;
  border-radius: 10px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  text-decoration: none;
  width: 90%;
  max-width: 600px;
  transition: transform 0.3s, background-color 0.3s;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.video-section:hover {
  background-color: #006666;
  transform: scale(1.05);
}
  </style>
</head>
<body>

<header>
  <div class="menu">
    &#x22EE;
    <div class="menu-items">
      <a href="page1.html">Home</a>
      <a href="About us.html">About Us</a>
      
    </div>
  </div>
  <div class="logo">99.com</div>
</header>

<h1>Skill-Based Courses (Starting June 20)</h1>
<a href="https://www.youtube.com/watch?v=VIDEO_ID" target="_blank" class="video-section">
  Watch Free Demo Session<br><small>(Click to Watch Now)</small>
</a>
<div class="courses">
  <div class="course red">Web Development</div>
  <div class="course green">Data science</div>
  <div class="course blue">AI & ML</div>
  <div class="course orange">Cyber security</div>
  <div class="course purple">python</div>
  <div class="course teal">Ms office</div>
</div>

</body>
</html>
